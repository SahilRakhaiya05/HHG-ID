<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" fill="none" role="img" aria-label="Hacker builder character">
  <!-- Flat 2D character · black hoodie · cream face · yellow + pink accents · no tropical Goa motifs -->
  <defs>
    <linearGradient id="hoodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b6839"/>
      <stop offset="100%" stop-color="#02140c"/>
    </linearGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="120" cy="302" rx="58" ry="10" fill="#000" opacity=".35"/>

  <!-- legs -->
  <path d="M88 210 L78 292 L100 292 L106 210 Z" fill="#141414"/>
  <path d="M134 210 L140 292 L162 292 L152 210 Z" fill="#0f0f0f"/>
  <!-- shoes -->
  <path d="M72 288 L102 288 L104 298 L70 298 Z" fill="#0a0a0a" stroke="#fee101" stroke-width="1.5"/>
  <path d="M138 288 L168 288 L170 298 L136 298 Z" fill="#0a0a0a" stroke="#fee101" stroke-width="1.5"/>

  <!-- torso / hoodie -->
  <path d="M72 118
           C72 100 88 88 120 88
           C152 88 168 100 168 118
           L174 210
           C174 222 160 232 120 232
           C80 232 66 222 66 210 Z"
        fill="url(#hoodGrad)" stroke="#fee101" stroke-width="2.5"/>
  <!-- kangaroo pocket -->
  <path d="M92 168 L148 168 L146 196 Q120 204 94 196 Z" fill="#0a0a0a" stroke="#fee101" stroke-width="1.5"/>
  <!-- drawstrings -->
  <line x1="108" y1="128" x2="104" y2="168" stroke="#fee101" stroke-width="2" stroke-linecap="round"/>
  <line x1="132" y1="128" x2="136" y2="168" stroke="#fee101" stroke-width="2" stroke-linecap="round"/>
  <circle cx="104" cy="170" r="3" fill="#ff0080"/>
  <circle cx="136" cy="170" r="3" fill="#ff0080"/>

  <!-- arms -->
  <path d="M72 128 C48 140 42 168 52 196 L72 190 C66 168 70 148 78 138 Z" fill="#141414" stroke="#fee101" stroke-width="2"/>
  <path d="M168 128 C192 140 198 168 188 196 L168 190 C174 168 170 148 162 138 Z" fill="#141414" stroke="#fee101" stroke-width="2"/>
  <!-- hands -->
  <ellipse cx="56" cy="198" rx="12" ry="10" fill="#f5edd6"/>
  <ellipse cx="184" cy="198" rx="12" ry="10" fill="#f5edd6"/>

  <!-- hoodie hood behind head -->
  <ellipse cx="120" cy="92" rx="52" ry="48" fill="#0a0a0a" stroke="#fee101" stroke-width="2.5"/>
  <ellipse cx="120" cy="96" rx="40" ry="38" fill="#121212"/>

  <!-- head / face -->
  <ellipse cx="120" cy="96" rx="34" ry="36" fill="#f5edd6"/>
  <!-- hair fringe -->
  <path d="M90 78 Q120 58 150 78 Q140 70 120 68 Q100 70 90 78" fill="#0a0a0a"/>
  <!-- eyes -->
  <ellipse cx="106" cy="94" rx="5.5" ry="6.5" fill="#0a0a0a"/>
  <ellipse cx="134" cy="94" rx="5.5" ry="6.5" fill="#0a0a0a"/>
  <circle cx="108" cy="92" r="1.8" fill="#fee101"/>
  <circle cx="136" cy="92" r="1.8" fill="#fee101"/>
  <!-- brows -->
  <path d="M96 84 L114 82" stroke="#0a0a0a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M126 82 L144 84" stroke="#0a0a0a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M108 110 Q120 120 132 110" fill="none" stroke="#0a0a0a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="98" cy="106" r="5" fill="#ff0080" opacity=".18"/>
  <circle cx="142" cy="106" r="5" fill="#ff0080" opacity=".18"/>

  <!-- laptop held in front -->
  <g transform="translate(70 186)">
    <rect x="0" y="18" width="100" height="8" rx="2" fill="#1a1a1a" stroke="#fee101" stroke-width="1.5"/>
    <path d="M8 18 L16 0 H84 L92 18 Z" fill="#0a0a0a" stroke="#fee101" stroke-width="1.8"/>
    <path d="M20 4 H80 L86 16 H14 Z" fill="url(#screenGrad)"/>
    <!-- code lines on screen -->
    <line x1="26" y1="8" x2="52" y2="8" stroke="#fee101" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="26" y1="11.5" x2="64" y2="11.5" stroke="#7dffc8" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
    <line x1="26" y1="15" x2="44" y2="15" stroke="#ff0080" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- headset -->
  <path d="M86 88 C82 70 100 56 120 56 C140 56 158 70 154 88" fill="none" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
  <rect x="78" y="84" width="12" height="18" rx="4" fill="#0a0a0a" stroke="#fee101" stroke-width="1.5"/>
  <rect x="150" y="84" width="12" height="18" rx="4" fill="#0a0a0a" stroke="#fee101" stroke-width="1.5"/>
  <circle cx="156" cy="78" r="4" fill="#ff0080"/>

  <!-- status badge on sleeve -->
  <circle cx="54" cy="156" r="7" fill="#fee101"/>
  <text x="54" y="159.5" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" font-weight="800" fill="#02140c">HH</text>
</svg>
